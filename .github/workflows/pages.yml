name: Web build (GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - 'game/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 4.0.10
      - name: Build raylib 6.0 for the web
        run: |
          curl -sSL https://github.com/raysan5/raylib/archive/refs/tags/6.0.tar.gz | tar -xz -C "$RUNNER_TEMP"
          make -C "$RUNNER_TEMP/raylib-6.0/src" PLATFORM=PLATFORM_WEB -j4
          ls "$RUNNER_TEMP/raylib-6.0/src/libraylib.web.a"
      - name: Build the game
        run: make -C game web RAYLIB_WEB_DIR="$RUNNER_TEMP/raylib-6.0"
      - name: Assemble the site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p _site
          cp game/build-web/index.html game/build-web/index.js game/build-web/index.wasm game/build-web/index.data _site/
          gh release download v1.0.0 --repo "$GITHUB_REPOSITORY" --dir _site \
            --pattern kogitsune-trailer-40s.mp4 --pattern kogitsune-poster.jpg
          mv _site/kogitsune-trailer-40s.mp4 _site/trailer-40s.mp4
          mv _site/kogitsune-poster.jpg _site/poster.jpg
          cp game/assets/MUSIC-CREDITS.txt _site/
          cp game/assets/title-background-v1.png _site/title-background.png
          cp game/assets/title-logo-v1.png _site/title-logo.png
          touch _site/.nojekyll
          ls -la _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
