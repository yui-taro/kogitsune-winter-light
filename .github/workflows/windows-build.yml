name: Windows build

on:
  push:
    paths:
      - 'game/**'
      - 'tests/**'
      - '.github/workflows/windows-build.yml'
  pull_request:
    paths:
      - 'game/**'
      - 'tests/**'
      - '.github/workflows/windows-build.yml'
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install curl for static linking
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$env:RUNNER_TEMP/vcpkg"
          & "$env:RUNNER_TEMP/vcpkg/bootstrap-vcpkg.bat" -disableMetrics
          & "$env:RUNNER_TEMP/vcpkg/vcpkg.exe" install curl:x64-windows-static
      - name: Configure
        shell: pwsh
        run: |
          cmake -S game -B game/build-windows -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$env:RUNNER_TEMP/vcpkg/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Build and test
        shell: pwsh
        run: |
          cmake --build game/build-windows --config Release
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if (-not (Test-Path game/build-windows/Release/foxgame.exe)) { throw "foxgame.exe was not built" }
          if (-not (Test-Path game/build-windows/Release/assets/music.pak)) { throw "assets were not copied" }
          ctest --test-dir game/build-windows -C Release --output-on-failure
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Include license notices
        shell: pwsh
        run: |
          Copy-Item game/vendor/nlohmann/LICENSE.MIT game/build-windows/Release/LICENSE-json.txt
          Copy-Item game/vendor/raylib-LICENSE.txt game/build-windows/Release/LICENSE-raylib.txt
      - uses: actions/upload-artifact@v4
        with:
          name: kogitsune-windows-prototype
          path: game/build-windows/Release/
