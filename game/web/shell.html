<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>こぎつねと冬の灯り</title>
  <meta name="description" content="凍える弟妹のために、子狐が山の神社の灯籠を盗み出す 2.5D ステルスゲーム。">
  <meta property="og:title" content="こぎつねと冬の灯り">
  <meta property="og:description" content="凍える弟妹のために、子狐が山の神社の灯籠を盗み出す 2.5D ステルスゲーム。">
  <meta property="og:image" content="poster.jpg">
  <style>
    :root { --ivory: rgb(248, 239, 220); --gold: rgb(244, 187, 98); --blue: rgb(20, 35, 51); --night: #06101a; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: var(--night); color: var(--ivory);
      font-family: "Hiragino Sans", "Yu Gothic", "Noto Sans JP", sans-serif; }
    canvas#canvas { display: block; width: 100vw; height: 100vh; outline: none; background: var(--night); }
    #overlay { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 22px; padding: 16px; box-sizing: border-box; text-align: center;
      background: linear-gradient(rgba(6, 16, 26, 0.5), rgba(6, 16, 26, 0.88)), url("title-background.png") center / cover no-repeat var(--night); }
    #overlay h1 { margin: 0; line-height: 0; }
    #overlay h1 img { width: min(520px, 78vw); height: auto; filter: drop-shadow(0 4px 18px rgba(0, 0, 0, 0.6)); }
    #overlay p { margin: 0; max-width: 34em; line-height: 1.7; font-size: clamp(14px, 1.8vw, 18px); text-shadow: 0 1px 8px #000; }
    .bar { width: min(420px, 80vw); height: 8px; border-radius: 4px; background: rgba(248, 239, 220, 0.18); overflow: hidden; }
    .bar > div { height: 100%; width: 0; background: var(--gold); transition: width 0.2s; }
    #status { font-size: 15px; min-height: 1.4em; opacity: 0.9; }
    .buttons { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
    button { font: inherit; font-size: 18px; padding: 12px 26px; border-radius: 14px; cursor: pointer;
      border: 2px solid var(--gold); background: rgba(20, 35, 51, 0.9); color: var(--ivory); }
    button.primary { background: rgb(107, 75, 40); }
    button:disabled { opacity: 0.45; cursor: default; }
    .hint { font-size: 14px; opacity: 0.85; }
    #video-modal { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; padding: 16px;
      background: rgba(3, 8, 14, 0.92); z-index: 10; }
    #video-modal video { width: min(1280px, 100%); max-height: 86vh; border-radius: 10px; background: #000; }
    #video-modal .close { position: absolute; top: 14px; right: 16px; }
    #login { display: none; flex-direction: column; align-items: center; gap: 8px; padding: 12px 18px; border-radius: 14px;
      background: rgba(20, 35, 51, 0.82); border: 1px solid rgba(244, 187, 98, 0.45); }
    #login .row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
    #login input { font: inherit; font-size: 16px; padding: 9px 12px; border-radius: 10px; width: 220px;
      border: 1px solid rgba(248, 239, 220, 0.5); background: rgba(6, 16, 26, 0.85); color: var(--ivory); }
    #login button { font-size: 16px; padding: 9px 18px; }
    #login-status { font-size: 14px; min-height: 1.3em; }
    #login-status.ok { color: var(--gold); }
    #trailer-mini { position: fixed; left: 50%; bottom: 8px; transform: translateX(-50%); display: none;
      font-size: 13px; padding: 5px 14px; border-width: 1px; opacity: 0.55; }
    #trailer-mini:hover { opacity: 1; }
  </style>
</head>
<body>
  <canvas id="canvas" tabindex="0" oncontextmenu="event.preventDefault()"></canvas>

  <div id="overlay">
    <h1><img src="title-logo.png" alt="こぎつねと冬の灯り"></h1>
    <p>凍える弟妹のために、子狐が山の神社の灯籠を盗み出す。灯籠を守る狛犬は、見聞きした手掛かりから次の一手を選ぶ。</p>
    <div class="bar"><div id="progress"></div></div>
    <div id="status">読み込み中…</div>
    <form id="login" autocomplete="on">
      <div>ログインすると、狛犬が AI「Jev」で考えて動きます</div>
      <div class="row">
        <input id="password" type="password" placeholder="パスワード" autocomplete="current-password" aria-label="パスワード">
        <button id="login-btn" type="submit">ログイン</button>
      </div>
      <div id="login-status">ログインしなくても遊べます（狛犬はローカル判断）</div>
    </form>
    <div class="buttons">
      <button id="start" class="primary" disabled>はじめる</button>
      <button id="trailer">紹介動画を見る</button>
    </div>
    <div class="hint">移動 WASD／矢印 ・ 伏せる C ・ 走る Shift ・ 足跡を払う Q ・ 触れる E ・ 一時停止 Esc<br>音が出ます。パソコンのブラウザで遊んでください。</div>
  </div>
  <button id="trailer-mini">紹介動画</button>

  <div id="video-modal">
    <button class="close" id="video-close">閉じる</button>
    <video id="video" src="trailer-40s.mp4" poster="poster.jpg" controls playsinline preload="none"></video>
  </div>

  <script src="relay-config.js"></script>
  <script>
    var overlay = document.getElementById("overlay");
    var startBtn = document.getElementById("start");
    var statusEl = document.getElementById("status");
    var progressEl = document.getElementById("progress");
    var canvas = document.getElementById("canvas");
    var ready = false;

    var Module = {
      canvas: canvas,
      print: function (t) { console.log(t); },
      printErr: function (t) { console.warn(t); },
      setStatus: function (text) {
        var m = text && text.match(/\((\d+(?:\.\d+)?)\/(\d+)\)/);
        if (m) {
          var pct = Math.round(100 * parseFloat(m[1]) / parseFloat(m[2]));
          progressEl.style.width = pct + "%";
          statusEl.textContent = "読み込み中… " + pct + "%";
        } else if (!text && !ready) {
          progressEl.style.width = "100%";
        }
      },
      onRuntimeInitialized: function () {
        ready = true;
        progressEl.style.width = "100%";
        statusEl.textContent = "準備ができました";
        startBtn.disabled = false;
      }
    };
    window.onerror = function () { statusEl.textContent = "読み込みに失敗しました。ページを再読み込みしてください。"; };

    // ---- Jev relay login (only shown when the site has a relay configured) ----
    var relayUrl = (window.KOGITSUNE_RELAY_URL || "").replace(/\/+$/, "");
    window.KOGITSUNE_RELAY_URL = relayUrl;  // the game appends /decision
    var loginForm = document.getElementById("login");
    var loginStatus = document.getElementById("login-status");
    var loginBtn = document.getElementById("login-btn");
    var passwordEl = document.getElementById("password");
    function token() { try { return sessionStorage.getItem("kogitsune-token") || ""; } catch (e) { return ""; } }
    function showLoggedIn() {
      loginStatus.className = "ok";
      loginStatus.textContent = "ログイン中：狛犬は Jev で考えます";
      passwordEl.style.display = "none";
      loginBtn.textContent = "ログアウト";
    }
    function showLoggedOut(message) {
      loginStatus.className = "";
      loginStatus.textContent = message || "ログインしなくても遊べます（狛犬はローカル判断）";
      passwordEl.style.display = "";
      loginBtn.textContent = "ログイン";
    }
    Module.onRelayLoggedOut = function () { showLoggedOut("ログインの期限が切れました。狛犬はローカル判断に切り替わりました"); };
    if (relayUrl) {
      loginForm.style.display = "flex";
      if (token()) showLoggedIn();
      // Wake a sleeping free-tier relay early so the first login is quick.
      fetch(relayUrl + "/health").catch(function () {});
    }
    loginForm.addEventListener("submit", function (e) {
      e.preventDefault();
      if (token()) { try { sessionStorage.removeItem("kogitsune-token"); } catch (x) {} showLoggedOut(); return; }
      var password = passwordEl.value;
      if (!password) { loginStatus.textContent = "パスワードを入力してください"; return; }
      loginBtn.disabled = true;
      loginStatus.className = "";
      loginStatus.textContent = "確認しています…";
      var slow = setTimeout(function () { loginStatus.textContent = "サーバーを起こしています（最大1分ほど）…"; }, 3000);
      var controller = new AbortController();
      var timer = setTimeout(function () { controller.abort(); }, 70000);
      fetch(relayUrl + "/login", {method: "POST", headers: {"Content-Type": "application/json"},
                                  body: JSON.stringify({password: password}), signal: controller.signal})
        .then(function (r) { return r.json().catch(function () { return {}; }).then(function (b) { return [r.status, b]; }); })
        .then(function (res) {
          if (res[0] === 200 && res[1].token) {
            try { sessionStorage.setItem("kogitsune-token", res[1].token); } catch (x) {}
            passwordEl.value = "";
            showLoggedIn();
          } else if (res[0] === 401) {
            showLoggedOut("パスワードが違います");
          } else if (res[0] === 429) {
            showLoggedOut("試行回数が多すぎます。15分ほど待ってからもう一度試してください");
          } else {
            showLoggedOut("ログインできませんでした。時間をおいて試してください");
          }
        })
        .catch(function () { showLoggedOut("サーバーにつながりませんでした。時間をおいて試してください"); })
        .then(function () { clearTimeout(slow); clearTimeout(timer); loginBtn.disabled = false; });
    });

    var started = false;
    startBtn.addEventListener("click", function () {
      if (started) return;
      started = true;
      // main() runs only now, so the guardian mode matches the login state chosen above.
      Module.callMain([]);
      overlay.style.display = "none";
      document.getElementById("trailer-mini").style.display = "block";
      canvas.focus();
    });
    canvas.addEventListener("click", function () { canvas.focus(); });
    // Keep arrow keys and Space for the game instead of scrolling the page.
    window.addEventListener("keydown", function (e) {
      if (overlay.style.display === "none" && ["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", " "].indexOf(e.key) >= 0) e.preventDefault();
    }, { passive: false });

    var modal = document.getElementById("video-modal");
    var video = document.getElementById("video");
    function openTrailer() { modal.style.display = "flex"; video.play(); }
    function closeTrailer() { video.pause(); modal.style.display = "none"; if (overlay.style.display === "none") canvas.focus(); }
    document.getElementById("trailer").addEventListener("click", openTrailer);
    document.getElementById("trailer-mini").addEventListener("click", openTrailer);
    document.getElementById("video-close").addEventListener("click", closeTrailer);
    modal.addEventListener("click", function (e) { if (e.target === modal) closeTrailer(); });
  </script>
  {{{ SCRIPT }}}
</body>
</html>
